# Development profile
# Use Dockerfile-compatible environment variable names with local defaults.
spring.datasource.url=jdbc:mysql://${DATABASE_URL:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:bluepatitas}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

# Developer-friendly JPA behavior
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Explicitly set MySQL dialect so Hibernate doesn't require a live connection to auto-detect it
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# App port
server.port=${PORT:8080}